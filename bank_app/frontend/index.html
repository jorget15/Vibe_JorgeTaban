<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Banking App</title>
  </head>
  <body>
    <!--
      This is the single HTML page for the entire app.
      Vite intercepts this request during development and handles
      JSX transpilation on the fly, so the browser never sees raw JSX.
    -->
    <div id="root"></div> <!--React mounts inside the empty <div id="root"> everything you see on screen is injected here by JavaScript. -->
    <script type="module" src="/src/main.jsx"></script> <!-- this tag loads main.jsx as an ES module. -->
  </body>
</html>
